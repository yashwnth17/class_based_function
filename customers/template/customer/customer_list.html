
<!DOCTYPE html>
<html>
<head>
<title>Customers</title>

<style>
/* General styling */
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 40px 20px;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #dbeafe, #ede9fe, #f5f3ff);
    color: #1e293b;
    min-height: 100vh;
}

/* Main heading */
h1 {
    max-width: 950px;
    margin: 0 auto 25px;
    padding: 30px;
    color: white;
    font-size: 36px;
    letter-spacing: 1px;
    border-radius: 18px;
    background: linear-gradient(135deg, #4338ca, #7c3aed, #a855f7);
    box-shadow: 0 12px 30px rgba(79, 70, 229, 0.25);
}

/* Add customer link */
body > a {
    display: block;
    width: fit-content;
    max-width: 950px;
    margin: 0 auto 25px;
    padding: 13px 22px;
    color: white;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    border-radius: 10px;
    text-decoration: none;
    font-size: 15px;
    font-weight: 700;
    box-shadow: 0 6px 15px rgba(79, 70, 229, 0.2);
    transition: all 0.3s ease;
}

body > a:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 22px rgba(79, 70, 229, 0.3);
}

/* Horizontal line */
hr {
    max-width: 950px;
    margin: 25px auto;
    border: none;
    border-top: 2px solid #c7d2fe;
}

/* Customer list */
ul {
    max-width: 950px;
    margin: 0 auto;
    padding: 0;
    list-style: none;
}

/* Each customer card */
ul li {
    margin-bottom: 16px;
    padding: 22px 25px;
    background: rgba(255, 255, 255, 0.95);
    border: 1px solid #e0e7ff;
    border-left: 5px solid #6366f1;
    border-radius: 14px;
    box-shadow: 0 5px 18px rgba(30, 41, 59, 0.07);
    line-height: 2;
    overflow-wrap: anywhere;
    transition: all 0.3s ease;
}

ul li:hover {
    transform: translateY(-4px);
    border-left-color: #9333ea;
    box-shadow: 0 12px 28px rgba(79, 70, 229, 0.14);
}

/* Customer name link */
ul li a {
    text-decoration: none;
    font-weight: 700;
    transition: color 0.3s ease;
}

ul li a:first-child {
    color: #4338ca;
    font-size: 18px;
}

ul li a:first-child:hover {
    color: #9333ea;
}

/* Edit link */
ul li a[href*="update"] {
    display: inline-block;
    padding: 4px 12px;
    margin: 0 4px;
    color: #047857;
    background: #d1fae5;
    border-radius: 7px;
    font-size: 13px;
}

ul li a[href*="update"]:hover {
    background: #a7f3d0;
}

/* Delete link */
ul li a[href*="delete"] {
    display: inline-block;
    padding: 4px 12px;
    margin-left: 4px;
    color: #dc2626;
    background: #fee2e2;
    border-radius: 7px;
    font-size: 13px;
}

ul li a[href*="delete"]:hover {
    background: #fecaca;
}

/* Empty customer message */
ul li:only-child:not(:has(a)) {
    padding: 35px;
    text-align: center;
    color: #64748b;
    background: white;
    border: 2px dashed #c7d2fe;
    border-radius: 14px;
}

/* Responsive design */
@media (max-width: 600px) {
    body {
        padding: 25px 12px;
    }

    h1 {
        padding: 25px 18px;
        font-size: 27px;
    }

    ul li {
        padding: 17px;
        font-size: 14px;
    }

    ul li a:first-child {
        font-size: 16px;
    }

    ul li a[href*="update"],
    ul li a[href*="delete"] {
        margin-top: 5px;
    }
}
</style>

</head>
<body>
<h1>Customer List</h1>
<a href="{% url 'customer-create' %}">+ Add New Customer</a>
<hr>
<ul>
{% for customer in customers %}
<li>
<a href="{% url 'customer-detail' customer.pk %}">
{{ customer.name }}
</a>
({{ customer.email }})

<a href="{% url 'customer-update' customer.pk %}">Edit</a>

<a href="{% url 'customer-delete' customer.pk %}">Delete</a>
</li>
{% empty %}
<li>No customers yet.</li>
{% endfor %}
</ul>
</body>
</html>
