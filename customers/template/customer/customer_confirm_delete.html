
<!DOCTYPE html>
<html>
<head>
<title>Delete Customer</title>

<style>
/* General styling */
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px 20px;
    min-height: 100vh;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #fee2e2, #fef2f2, #ffe4e6);
    color: #1e293b;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

/* Main heading */
h1 {
    width: 100%;
    max-width: 600px;
    margin: 0;
    padding: 35px 25px;
    text-align: center;
    font-size: 32px;
    color: white;
    background: linear-gradient(135deg, #dc2626, #e11d48, #be123c);
    border-radius: 20px 20px 0 0;
    box-shadow: 0 12px 30px rgba(220, 38, 38, 0.2);
}

/* Confirmation message */
p {
    width: 100%;
    max-width: 600px;
    margin: 0;
    padding: 35px 30px 25px;
    background: white;
    text-align: center;
    font-size: 17px;
    line-height: 1.8;
    color: #475569;
}

/* Highlight customer name */
p strong {
    display: inline-block;
    margin: 5px;
    padding: 5px 12px;
    color: #b91c1c;
    background: #fee2e2;
    border-radius: 7px;
    font-weight: 700;
    overflow-wrap: anywhere;
}

/* Delete form */
form {
    width: 100%;
    max-width: 600px;
    padding: 10px 30px 25px;
    background: white;
    text-align: center;
}

/* Delete button */
button[type="submit"] {
    width: 100%;
    max-width: 320px;
    padding: 15px 20px;
    border: none;
    border-radius: 11px;
    background: linear-gradient(135deg, #dc2626, #e11d48);
    color: white;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 7px 18px rgba(220, 38, 38, 0.22);
    transition: all 0.3s ease;
}

button[type="submit"]:hover {
    background: linear-gradient(135deg, #b91c1c, #be123c);
    transform: translateY(-3px);
    box-shadow: 0 12px 25px rgba(220, 38, 38, 0.3);
}

/* Cancel link */
body > a {
    display: block;
    width: 100%;
    max-width: 600px;
    padding: 20px 30px 30px;
    text-align: center;
    text-decoration: none;
    font-size: 15px;
    font-weight: 700;
    color: #475569;
    background: white;
    border-radius: 0 0 20px 20px;
    transition: all 0.3s ease;
}

body > a:hover {
    color: #4338ca;
    background: #f8fafc;
}

/* Responsive design */
@media (max-width: 600px) {
    body {
        padding: 20px 14px;
    }

    h1 {
        padding: 28px 15px;
        font-size: 26px;
    }

    p {
        padding: 28px 18px 20px;
        font-size: 15px;
    }

    form {
        padding: 10px 20px 20px;
    }

    button[type="submit"] {
        font-size: 15px;
    }

    body > a {
        padding: 18px 20px 25px;
    }
}
</style>

</head>
<body>
<h1>Delete Customer</h1>
<p>Are you sure you want to delete <strong>{{ object.name }}</strong>?</p>
<form method="post">
{% csrf_token %}
<button type="submit">Yes, delete</button>
</form>
<a href="{% url 'customer-list' %}">Cancel</a>
</body>
</html>
