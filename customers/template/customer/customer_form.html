
<!DOCTYPE html>
<html>
<head>
<title>{% if form.instance.pk %}Edit{% else %}Add{% endif %} Customer</title>

<style>
/* General styling */
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 50px 20px;
    min-height: 100vh;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #dbeafe, #ede9fe, #f5f3ff);
    color: #1e293b;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* Main heading */
h1 {
    width: 100%;
    max-width: 650px;
    margin: 0;
    padding: 30px;
    text-align: center;
    font-size: 32px;
    color: white;
    letter-spacing: 0.5px;
    background: linear-gradient(135deg, #4338ca, #7c3aed, #a855f7);
    border-radius: 20px 20px 0 0;
    box-shadow: 0 12px 30px rgba(79, 70, 229, 0.2);
}

/* Form container */
form {
    width: 100%;
    max-width: 650px;
    padding: 35px;
    background: white;
    border-radius: 0 0 20px 20px;
    box-shadow: 0 18px 45px rgba(30, 41, 59, 0.12);
}

/* Django form paragraphs */
form p {
    margin: 0 0 23px;
}

/* Labels */
form label {
    display: block;
    margin-bottom: 9px;
    font-size: 15px;
    font-weight: 700;
    color: #334155;
}

/* Input fields */
form input,
form select,
form textarea {
    width: 100%;
    padding: 13px 15px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    background: #f8fafc;
    color: #1e293b;
    font-family: inherit;
    font-size: 15px;
    outline: none;
    transition: all 0.3s ease;
}

/* Focus effect */
form input:focus,
form select:focus,
form textarea:focus {
    border-color: #6366f1;
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.13);
}

/* Textarea */
form textarea {
    min-height: 110px;
    resize: vertical;
}

/* Help text */
form .helptext {
    display: block;
    margin-top: 7px;
    font-size: 12px;
    color: #64748b;
}

/* Error messages */
form .errorlist {
    margin: 0 0 8px;
    padding: 10px 15px;
    list-style: none;
    color: #b91c1c;
    background: #fee2e2;
    border-radius: 8px;
    font-size: 13px;
}

/* Save button */
button[type="submit"] {
    width: 100%;
    margin-top: 8px;
    padding: 15px;
    border: none;
    border-radius: 11px;
    color: white;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 7px 18px rgba(79, 70, 229, 0.22);
    transition: all 0.3s ease;
}

button[type="submit"]:hover {
    transform: translateY(-3px);
    background: linear-gradient(135deg, #4338ca, #6d28d9);
    box-shadow: 0 12px 25px rgba(79, 70, 229, 0.3);
}

/* Cancel link */
body > a {
    display: inline-block;
    margin-top: 22px;
    padding: 12px 25px;
    color: #4338ca;
    background: #ffffff;
    border: 1px solid #c7d2fe;
    border-radius: 10px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
    box-shadow: 0 5px 15px rgba(30, 41, 59, 0.06);
    transition: all 0.3s ease;
}

body > a:hover {
    color: white;
    background: #4338ca;
    transform: translateY(-2px);
}

/* Responsive design */
@media (max-width: 600px) {
    body {
        padding: 25px 14px;
    }

    h1 {
        padding: 25px 15px;
        font-size: 25px;
    }

    form {
        padding: 25px 20px;
    }

    form input,
    form select,
    form textarea {
        padding: 12px;
    }
}
</style>

</head>
<body>
<h1>{% if form.instance.pk %}Edit{% else %}Add New{% endif %} Customer</h1>
<form method="post">
{% csrf_token %}
{{ form.as_p }}
<button type="submit">Save</button>
</form>

<a href="{% url 'customer-list' %}">Cancel</a>
</body>
</html>
